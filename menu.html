function classifyWine(name) {
  const n = name.toLowerCase();
  if (/calice/.test(n)) return 'Calici al vetro';
  if (/metodo classico|charmat|trabocco/.test(n)) return 'Bollicine & Metodo Classico';
  if (/cerasuolo|rosato|fossimatto/.test(n)) return 'Cerasuoli & Rosati';
  if (/montepulciano|pinto\s*11|maleducato\s*11|dire\s*bere|febbre\s*d'abruzzo/.test(n)) return 'Vini Rossi & Montepulciano';
  if (/trebbiano|pecorino|passerina|chardonnay|maiolica|orange|blondie|pane\s*al\s*pane/.test(n)) return 'Vini Bianchi & Orange';
  return 'Acqua, Birra & Caffetteria';
}

function getAlgs(name) {
  const n = name.toLowerCase();
  const algs = [];
  if (/pane|pasta|linguina|rigatoro|pizzell|cantucci|qubetto|pacchero|spaghetti|gnocch|farina|grano/i.test(n)) algs.push('Glutine');
  if (/granchio|panocchie|scampi|gamberi/i.test(n)) algs.push('Crostacei');
  if (/cozze|vongole|totanett|totanetti/i.test(n)) algs.push('Molluschi');
  if (/alici|alicette|baccalà|nasello|sgombro|pesce/i.test(n)) algs.push('Pesce');
  if (/uova|cace e ove|majo|maionese|tiramisù|zafferamisù/i.test(n)) algs.push('Uova');
  if (/formaggio|ricotta|gregoriano|latte|burro|cacio|pecorino|mozzarella/i.test(n)) algs.push('Latticini');
  if (/mandorle|nocciole|noci|pistacchio/i.test(n)) algs.push('Frutta a guscio');
  if (/senape/i.test(n)) algs.push('Senape');
  if (/doc|igt|vino|calice|cerasuolo|trebbiano|pecorino|montepulciano|passerina|chardonnay|bollicine|charmat/i.test(n)) algs.push('Solfiti');
  return algs.length > 0 ? algs : ['Nessun allergene maggiore dichiarato'];
}

function render(activeTab='giorno') {
  const lang=sel.value;
  document.documentElement.lang=lang;
  document.getElementById('notice').textContent=NOTICE[lang] || NOTICE.it;
  
  ['btnGiorno','btnVini','btnAllergeni'].forEach(id => document.getElementById(id).classList.remove('active'));
  if(activeTab==='giorno') document.getElementById('btnGiorno').classList.add('active');
  if(activeTab==='vini') document.getElementById('btnVini').classList.add('active');
  if(activeTab==='allergeni') document.getElementById('btnAllergeni').classList.add('active');

  const content=document.getElementById('content');
  content.replaceChildren();

  if (activeTab === 'allergeni') {
    const box = document.createElement('div');

    const header = document.createElement('div');
    header.className = 'brand-header';
    header.innerHTML = LOGO_SVG + '<h3 style="color:#FF5733; margin-top:8px; font-size:1.15rem;">⚠️ TABELLA ALLERGENI</h3><p style="font-size:0.75rem; font-weight:700; color:#062329;">Conforme Reg. UE 1169/2011</p>';
    box.append(header);

    menu.forEach(item => {
      const article = document.createElement('article'), text = document.createElement('div'), algSpan = document.createElement('div');
      const t = TRANSLATIONS[String(item.id)];
      const translated = lang!=='it'&&t?.source===item.name?t[lang]:null;
      text.innerHTML = `<b>• ${translated || item.name}</b>`;
      if(translated) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }
      
      algSpan.style.cssText = "color:#FF5733; font-weight:800; font-size:0.8rem; text-align:right; white-space:nowrap;";
      algSpan.textContent = getAlgs(item.name).join(', ');
      article.append(text, algSpan);
      box.append(article);
    });
    content.append(box);
    return;
  }

  if (activeTab === 'vini') {

    box.append(header);

    const drinks = menu.filter(x => x.cat === '2 Bevande');

    categories.forEach(catName => {
      const itemsInCat = drinks.filter(d => classifyWine(d.name) === catName);
      if(!itemsInCat.length) return;
      
      const h2 = document.createElement('h2');
      h2.textContent = catName;
      box.append(h2);

      itemsInCat.forEach(item => {
        const article = document.createElement('article'), text = document.createElement('div'), price = document.createElement('div');
        const t = TRANSLATIONS[String(item.id)];
        const translated = lang!=='it'&&t?.source===item.name?t[lang]:null;
        text.innerHTML = `<b>• ${translated || item.name}</b>`;
        if(translated) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }
        
        price.className = 'price';
        price.textContent = new Intl.NumberFormat(lang,{style:'currency',currency:'EUR'}).format(Number(item.price)||0);
        article.append(text, price);
        box.append(article);
      });
    });
    content.append(box);
    return;
  }

  // Menù del giorno
  const catsMap = ['1 Coperto', '2 Bevande', '3 Antipasti', '4 Primi Piatti', '5 Secondi', '6 Desserts'];
  const titlesMap = {it:['Coperto','Bevande','Antipasti','Primi piatti','Secondi e contorni','Dessert'], en:['Cover','Drinks','Starters','First courses','Main courses','Desserts']};
  
  const box = document.createElement('div');
  box.className = 'card-box';
  const header = document.createElement('div');
  header.className = 'brand-header';
  header.innerHTML = LOGO_SVG + '<h3 style="color:#FF5733; margin-top:8px; font-size:1.2rem; letter-spacing:1px;">✨ MENÙ DEL GIORNO ✨</h3><p style="font-size:0.78rem; font-weight:700; color:#062329; margin-top:2px;">' + new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '</p>';
  box.append(header);

  CATS[lang].forEach((title, index) => {
    const catCode = catsMap[index];
    const rows = menu.filter(x => x.cat === catCode && x.cat !== '2 Bevande');
    if(!rows.length) return;

    const h2 = document.createElement('h2');
    h2.textContent = title;
    box.append(h2);

    rows.forEach(item => {
      const article = document.createElement('article'), text = document.createElement('div'), price = document.createElement('div');
      const t = TRANSLATIONS[String(item.id)];
      const translated = lang!=='it'&&t?.source===item.name?t[lang]:null;
      text.innerHTML = `<b>• ${translated || item.name}</b>`;
      if(translated) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }
      
      price.className = 'price';
      price.textContent = new Intl.NumberFormat(lang,{style:'currency',currency:'EUR'}).format(Number(item.price)||0);
      article.append(text, price);
      box.append(article);
    });
  });
  content.append(box);
}

function switchTab(t) { render(t); }

async function load(){
  if(busy)return;busy=true;
  try{
    const url=(window.ALICETTA_FIREBASE?.databaseURL||'https://alicetta-tables-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/$/,'')+'/pos_state/menu.json';
    const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(12000)});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(Array.isArray(data) && data.length > 0) { menu = data; }
    render();
    document.getElementById('status').textContent='🟢 Sincronizzato - '+new Date().toLocaleTimeString(sel.value);
  }catch(e){
    // Fallback con il menu di default se firebase non risponde
    if(!menu.length) {
      menu = [
        {id:101, cat:'1 Coperto', name:'Pane e Coperto', price:3},
        {id:301, cat:'3 Antipasti', name:'Alici marinate, peperone dolce di Altino e pere croccanti', price:15},
        {id:302, cat:'3 Antipasti', name:'Alicette impanate e fritte con majo al prezzemolo', price:13},
        {id:401, cat:'4 Primi Piatti', name:'Qubetto Verrigni alle vongole e crema di rape', price:14},
        {id:501, cat:'5 Secondi', name:'Baccalà in vasocottura con patate, peperoni arrosto, olive e timo', price:16},
        {id:601, cat:'6 Desserts', name:'Zafferamisù (tiramisù alla ricotta di pecora e zafferano)', price:7}
      ];
    }
    render();
    document.getElementById('status').textContent='⚠️ Modalità offline';
  }
  finally{busy=false;}
}
render();load();setInterval(load,15000);
</script></body></html>
