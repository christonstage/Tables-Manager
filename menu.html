<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alicetta — Menù, Vini & Allergeni</title>
<meta name="theme-color" content="#2ECC71">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #2ecc71; color: #062329; font-family: 'Plus Jakarta Sans', Arial, sans-serif; padding-bottom: 50px; }
  main { max-width: 600px; margin: auto; padding: 16px; }
  header, .card-box { background: white; border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 3px solid #ff5733; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
  h1 { color: #ff5733; font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  .brand-header { text-align: center; background: #1BE7FF; padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 2px solid #FF5733; }
  select, button { padding: 10px 14px; border-radius: 10px; font-size: 15px; font-weight: 700; border: 2px solid #ff5733; cursor: pointer; }
  article { padding: 10px 0; border-bottom: 1px dashed rgba(255,87,51,0.3); display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
  small { display: block; margin-top: 3px; color: #555; font-size: 0.78rem; }
  .price { white-space: nowrap; color: #ff5733; font-weight: 900; font-size: 1rem; }
  h2 { background: #1be7ff; color: #062329; padding: 10px 14px; border-radius: 10px; font-size: 1rem; border: 1.5px solid #ff5733; text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; margin-bottom: 8px; }
  .nav-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .btn-tab { background: #1BE7FF; color: #062329; border: 2px solid #FF5733; }
  .btn-tab.active { background: #FF5733; color: #fff; }
</style>
</head>
<body>
<main>
  <div class="nav-bar">
    <button class="btn-tab active" id="btnGiorno" onclick="switchTab('giorno')">🍽️ Menù del Giorno</button>
    <button class="btn-tab" id="btnVini" onclick="switchTab('vini')">🍷 Carta Vini</button>
    <button class="btn-tab" id="btnAllergeni" onclick="switchTab('allergeni')">⚠️ Allergeni</button>
    <button class="btn-tab" style="background:#fff;" onclick="window.print()">🖨️ Stampa PDF</button>
  </div>

  <header>
    <h1>🐟 Alicetta Trattoria</h1>
    <div style="text-align:center; margin-top:8px;">
      <label for="language" style="font-size:0.85rem; font-weight:800;">Lingua / Language: </label>
      <select id="language" onchange="render()">
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>
    <p id="notice" style="font-size:0.78rem; color:#4B5563; margin-top:8px; text-align:center;"></p>
  </header>

  <div id="content"></div>
</main>

<script>
const FB = "https://alicetta-tables-default-rtdb.europe-west1.firebasedatabase.app";

const LOGO_SVG = `<svg viewBox="0 0 220 72" xmlns="http://www.w3.org/2000/svg" style="max-width:180px; height:auto; display:block; margin:0 auto;"><g stroke="#FF5733" stroke-width="2.2" fill="#FF5733" stroke-linejoin="round"><polygon points="75,16 95,12 90,20"/><polygon points="95,12 115,12 103,20"/><polygon points="90,20 103,20 115,12 122,19 102,24"/><polygon points="75,16 90,20 102,24"/><polygon points="98,12 105,4 112,12"/><polygon points="102,24 108,31 115,22"/><polygon points="115,12 134,17 122,23" fill="none"/><polygon points="75,16 64,9 68,16 64,23" fill="none"/></g><circle cx="125" cy="17" r="1.8" fill="#FF5733"/><text x="110" y="51" text-anchor="middle" fill="#FF5733" font-family="sans-serif" font-size="21" font-weight="800" letter-spacing="4">ΛLICETTΛ</text><line x1="28" y1="58" x2="98" y2="58" stroke="#FF5733" stroke-width="1.6"/><circle cx="110" cy="58" r="2.2" fill="#FF5733"/><line x1="122" y1="58" x2="192" y2="58" stroke="#FF5733" stroke-width="1.6"/><text x="110" y="69" text-anchor="middle" fill="#FF5733" font-family="sans-serif" font-size="9.5" font-weight="700" letter-spacing="5">TRATTORIA</text></svg>`;

const NOTICE = {
  it: 'Per ingredienti e allergeni chiedere al personale. Le traduzioni sono descrittive.',
  en: 'Ask staff about ingredients and allergens. Translations are descriptive.',
  fr: 'Demandez au personnel les ingrédients et allergènes. Les traductions sont descriptives.',
  de: 'Fragen Sie das Personal nach Zutaten und Allergenen. Übersetzungen sind deskriptiv.',
  es: 'Consulte los ingredientes y alérgenos al personal. Las traducciones son descriptivas.'
};

const TITLES = {
  it: ['Antipasti', 'Primi Piatti', 'Secondi & Contorni', 'Desserts'],
  en: ['Starters', 'First Courses', 'Main Courses & Sides', 'Desserts'],
  fr: ['Entrées', 'Premiers Plats', 'Plats Principaux & Accompagnements', 'Desserts'],
  de: ['Vorspeisen', 'Erste Gänge', 'Hauptgerichte & Beilagen', 'Desserts'],
  es: ['Entrantes', 'Primeros Platos', 'Platos Principales & Guarniciones', 'Postres']
};

/* nomi allergeni: [en, fr, de, es] */
const ALG = {
  'Glutine': ['Gluten','Gluten','Gluten','Gluten'],
  'Crostacei': ['Crustaceans','Crustacés','Krebstiere','Crustáceos'],
  'Molluschi': ['Molluscs','Mollusques','Weichtiere','Moluscos'],
  'Pesce': ['Fish','Poisson','Fisch','Pescado'],
  'Uova': ['Eggs','Œufs','Eier','Huevos'],
  'Latticini': ['Milk','Lait','Milch','Leche'],
  'Frutta a guscio': ['Tree nuts','Fruits à coque','Schalenfrüchte','Frutos de cáscara'],
  'Senape': ['Mustard','Moutarde','Senf','Mostaza'],
  'Solfiti': ['Sulphites','Sulfites','Sulfite','Sulfitos'],
  'Arachidi': ['Peanuts','Arachides','Erdnüsse','Cacahuetes'],
  'Soia': ['Soy','Soja','Soja','Soja'],
  'Sedano': ['Celery','Céleri','Sellerie','Apio'],
  'Sesamo': ['Sesame','Sésame','Sesam','Sésamo'],
  'Lupini': ['Lupin','Lupin','Lupinen','Altramuces'],
  'Nessun allergene maggiore dichiarato': ['No major allergens declared','Aucun allergène majeur déclaré','Keine Hauptallergene deklariert','Ningún alérgeno principal declarado']
};
const LANG_IDX = { en: 0, fr: 1, de: 2, es: 3 };
function algName(a, lang) { const t = ALG[a]; return (lang === 'it' || !t) ? a : t[LANG_IDX[lang]]; }

let currentTab = 'giorno';
let DATA = { menu: [], daily: [] };
let lastSig = '';

async function loadData() {
  try {
    const t = Date.now();
    const [m, d] = await Promise.all([
      fetch(FB + '/pos_state/menu.json?t=' + t).then(r => r.json()),
      fetch(FB + '/daily_menu.json?t=' + t).then(r => r.json())
    ]);
    DATA = { menu: Object.values(m || {}), daily: Object.values((d && d.dishes) || {}) };
    try { localStorage.setItem('alicetta_menu_cache', JSON.stringify(DATA)); } catch (e) {}
  } catch (e) {
    try { DATA = JSON.parse(localStorage.getItem('alicetta_menu_cache')) || DATA; } catch (_) {}
  }
  const sig = JSON.stringify(DATA);
  if (sig !== lastSig) { lastSig = sig; render(); }
}

function classifyWine(name) {
  const n = name.toLowerCase();
  if (/calice/.test(n)) return 'Calici al vetro';
  if (/metodo classico|charmat|trabocco/.test(n)) return 'Bollicine & Metodo Classico';
  if (/cerasuolo|rosato|fossimatto/.test(n)) return 'Cerasuoli & Rosati';
  if (/montepulciano|pinto\s*11|maleducato\s*11|dire\s*bere|febbre\s*d'abruzzo/.test(n)) return 'Vini Rossi & Montepulciano';
  if (/trebbiano|pecorino|passerina|chardonnay|maiolica|orange|blondie|pane\s*al\s*pane/.test(n)) return 'Vini Bianchi & Orange';
  return 'Acqua, Birra & Caffetteria';
}

function getAlgs(name) {
  const n = name.toLowerCase();
  const algs = [];
  if (/pane|pasta|linguina|rigatoro|pizzell|cantucci|qubetto|pacchero|spaghetti|gnocch|farina|grano/i.test(n)) algs.push('Glutine');
  if (/granchio|panocchie|scampi|gamberi/i.test(n)) algs.push('Crostacei');
  if (/cozze|vongole|totanett|totanetti/i.test(n)) algs.push('Molluschi');
  if (/alici|alicette|baccalà|nasello|sgombro|pesce/i.test(n)) algs.push('Pesce');
  if (/uova|cace e ove|majo|maionese|tiramisù|zafferamisù/i.test(n)) algs.push('Uova');
  if (/formaggio|ricotta|gregoriano|latte|burro|cacio|pecorino|mozzarella/i.test(n)) algs.push('Latticini');
  if (/mandorle|nocciole|noci|pistacchio/i.test(n)) algs.push('Frutta a guscio');
  if (/senape/i.test(n)) algs.push('Senape');
  if (/doc|igt|vino|calice|cerasuolo|trebbiano|pecorino|montepulciano|passerina|chardonnay|bollicine|charmat/i.test(n)) algs.push('Solfiti');
  return algs.length > 0 ? algs : ['Nessun allergene maggiore dichiarato'];
}

function algsOf(item) {
  return (Array.isArray(item.allergens) && item.allergens.length) ? item.allergens : getAlgs(item.name);
}

function switchTab(tab) { currentTab = tab; render(); }

function makeRow(item, lang, rightText, rightStyle) {
  const a = document.createElement('article'), t = document.createElement('div'), r = document.createElement('div');
  const tr = lang !== 'it' && item.tr && item.tr[lang];
  const b = document.createElement('b');
  b.textContent = '• ' + (tr || item.name);
  t.append(b);
  if (tr) { const s = document.createElement('small'); s.textContent = item.name; t.append(s); }
  if (rightStyle) r.style.cssText = rightStyle; else r.className = 'price';
  r.textContent = rightText;
  a.append(t, r);
  return a;
}

function headerHTML(title, sub) {
  return `<div class="brand-header">${LOGO_SVG}<h3 style="color:#FF5733; margin-top:8px; font-size:1.15rem; letter-spacing:1px;">${title}</h3><p style="font-size:0.78rem; font-weight:700; color:#062329; margin-top:2px;">${sub}</p></div>`;
}

function render() {
  const lang = document.getElementById('language').value;
  document.documentElement.lang = lang;
  document.getElementById('notice').textContent = NOTICE[lang] || NOTICE.it;
  const tabIds = { giorno: 'btnGiorno', vini: 'btnVini', allergeni: 'btnAllergeni' };
  Object.keys(tabIds).forEach(k => document.getElementById(tabIds[k]).classList.toggle('active', currentTab === k));

  const content = document.getElementById('content');
  content.replaceChildren();

  const DISH_CATS = ['3 Antipasti', '4 Primi Piatti', '5 Secondi', '6 Desserts'];
  const wines = DATA.menu.filter(m => m && m.cat === '2 Bevande');
  const dishes = DATA.daily.length ? DATA.daily : DATA.menu.filter(m => m && DISH_CATS.includes(m.cat));
  const fmt = new Intl.NumberFormat(lang, { style: 'currency', currency: 'EUR' });

  const box = document.createElement('div');
  box.className = 'card-box';

  if (!dishes.length && !wines.length) {
    box.textContent = '⏳ …';
    content.append(box);
    return;
  }

  if (currentTab === 'allergeni') {
    box.innerHTML = headerHTML('⚠️ TABELLA ALLERGENI', 'Conforme Reg. UE 1169/2011');
    [...dishes, ...wines].forEach(item => {
      const txt = algsOf(item).map(a => algName(a, lang)).join(', ');
      box.append(makeRow(item, lang, txt, 'color:#FF5733; font-weight:800; font-size:0.8rem; text-align:right; max-width:45%;'));
    });
    content.append(box);
    return;
  }

  if (currentTab === 'vini') {
    box.innerHTML = headerHTML('🍷 CARTA DEI VINI 🍷', 'Selezione Cantine Abruzzesi & Artigianali');
    ['Bollicine & Metodo Classico', 'Vini Bianchi & Orange', 'Cerasuoli & Rosati', 'Vini Rossi & Montepulciano', 'Calici al vetro', 'Acqua, Birra & Caffetteria'].forEach(catName => {
      const rows = wines.filter(w => classifyWine(w.name) === catName);
      if (!rows.length) return;
      const h2 = document.createElement('h2');
      h2.textContent = catName;
      box.append(h2);
      rows.forEach(w => box.append(makeRow(w, lang, fmt.format(Number(w.price) || 0))));
    });
    content.append(box);
    return;
  }

  const today = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  box.innerHTML = headerHTML('✨ MENÙ DEL GIORNO ✨', today);
  const titles = TITLES[lang] || TITLES.it;
  DISH_CATS.forEach((cat, i) => {
    const rows = dishes.filter(d => d.cat === cat);
    if (!rows.length) return;
    const h2 = document.createElement('h2');
    h2.textContent = titles[i];
    box.append(h2);
    rows.forEach(d => box.append(makeRow(d, lang, fmt.format(Number(d.price) || 0))));
  });

  const footer = document.createElement('div');
  footer.style.cssText = 'margin-top:18px; text-align:center; background:#1BE7FF; padding:10px; border-radius:10px; border:1.5px solid #FF5733; color:#062329; font-weight:800; font-size:0.84rem;';
  footer.textContent = '🐟 Pane e Coperto € 3,00 — ENJOY! — 📞 392 3279000';
  box.append(footer);
  content.append(box);
}

try { DATA = JSON.parse(localStorage.getItem('alicetta_menu_cache')) || DATA; } catch (e) {}
render();
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
