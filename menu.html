const TRANSLATIONS = {
  "Pane e Coperto": {"en": "Bread and cover charge", "fr": "Pain et couvert", "de": "Brot und Gedeck", "es": "Pan y servicio de mesa"},
  "Polpette di granchio blu su salsa di zucca e olio alla salvia": {"en": "Blue crab balls with pumpkin sauce and sage oil", "fr": "Boulettes de crabe bleu, sauce à la courge et huile à la sauge", "de": "Blaukrabbenbällchen auf Kürbissauce mit Salbeiöl", "es": "Albóndigas de cangrejo azul con salsa de calabaza y aceite de salvia"},
  "Alicette impanate e fritte con majo al prezzemolo": {"en": "Breaded fried anchovies with parsley mayonnaise", "fr": "Petits anchois panés et frits, mayonnaise au persil", "de": "Panierte, frittierte Sardellen mit Petersilienmayonnaise", "es": "Anchoas pequeñas empanadas y fritas con mayonesa de perejil"},
  "Cozze gratinate con formaggio gregoriano, ventricina ed erbe aromatiche": {"en": "Mussels au gratin with Gregoriano cheese, ventricina cured meat and aromatic herbs", "fr": "Moules gratinées au fromage Gregoriano, ventricina et herbes aromatiques", "de": "Überbackene Miesmuscheln mit Gregoriano-Käse, Ventricina und Kräutern", "es": "Mejillones gratinados con queso Gregoriano, ventricina y hierbas aromáticas"},
  "Acqua Frizzante": {"en": "Sparkling water", "fr": "Eau gazeuse", "de": "Sprudelwasser", "es": "Agua con gas"},
  "Acqua Naturale": {"en": "Still water", "fr": "Eau plate", "de": "Stilles Wasser", "es": "Agua sin gas"},
  "Caffè": {"en": "Coffee", "fr": "Café", "de": "Kaffee", "es": "Café"}
};

const NOTICE = {
  it: 'Per ingredienti e allergeni chiedere al personale. Le traduzioni sono descrittive.',
  en: 'Ask staff about ingredients and allergens. Translations are descriptive.',
  fr: 'Demandez au personnel les ingrédients et allergènes. Les traductions sont descriptives.',
  de: 'Fragen Sie das Personal nach Zutaten und Allergenen. Übersetzungen sind deskriptiv.',
  es: 'Consulte los ingredientes y alérgenos al personal. Las traducciones son descriptivas.'
};

let currentTab = 'gorgio';

function classifyWine(name) {
  const n = name.toLowerCase();
  if (/calice/.test(n)) return 'Calici al vetro';
  if (/metodo classico|charmat|trabocco/.test(n)) return 'Bollicine & Metodo Classico';
  if (/cerasuolo|rosato|fossimatto/.test(n)) return 'Cerasuoli & Rosati';
  if (/montepulciano|pinto\s*11|maleducato\s*11|dire\s*bere|febbre\s*d'abruzzo/.test(n)) return 'Vini Rossi & Montepulciano';
  if (/trebbiano|pecorino|passerina|chardonnay|maiolica|orange|blondie|pane\s*al\s*pane/.test(n)) return 'Vini Bianchi & Orange';
  return 'Acqua, Birra & Caffetteria';
}

function getAlgs(name) {
  const n = name.toLowerCase();
  const algs = [];
  if (/pane|pasta|linguina|rigatoro|pizzell|cantucci|qubetto|pacchero|spaghetti|gnocch|farina|grano/i.test(n)) algs.push('Glutine');
  if (/granchio|panocchie|scampi|gamberi/i.test(n)) algs.push('Crostacei');
  if (/cozze|vongole|totanett|totanetti/i.test(n)) algs.push('Molluschi');
  if (/alici|alicette|baccalà|nasello|sgombro|pesce/i.test(n)) algs.push('Pesce');
  if (/uova|cace e ove|majo|maionese|tiramisù|zafferamisù/i.test(n)) algs.push('Uova');
  if (/formaggio|ricotta|gregoriano|latte|burro|cacio|pecorino|mozzarella/i.test(n)) algs.push('Latticini');
  if (/mandorle|nocciole|noci|pistacchio/i.test(n)) algs.push('Frutta a guscio');
  if (/senape/i.test(n)) algs.push('Senape');
  if (/doc|igt|vino|calice|cerasuolo|trebbiano|pecorino|montepulciano|passerina|chardonnay|bollicine|charmat/i.test(n)) algs.push('Solfiti');
  return algs.length > 0 ? algs : ['Nessun allergene maggiore dichiarato'];
}

function render(tab) {
  currentTab = tab;
  const lang = document.getElementById('language').value;
  document.documentElement.lang = lang;
  document.getElementById('notice').textContent = NOTICE[lang] || NOTICE.it;

  ['btnGiorno','btnVini','btnAllergeni'].forEach(id => document.getElementById(id).classList.remove('active'));
  if(tab==='giorno') document.getElementById('btnGiorno').classList.add('active');
  if(tab==='vini') document.getElementById('btnVini').classList.add('active');
  if(tab==='allergeni') document.getElementById('btnAllergeni').classList.add('active');

  const content = document.getElementById('content');
  content.replaceChildren();

  if (tab === 'allergeni') {
    const box = document.createElement('div');
    box.className = 'card-box';
    box.innerHTML = `<div class="brand-header">${LOGO_SVG}<h3 style="color:#FF5733; margin-top:8px; font-size:1.15rem;">⚠️ TABELLA ALLERGENI</h3><p style="font-size:0.75rem; font-weight:700; color:#062329;">Conforme Reg. UE 1169/2011</p></div>`;

    const allItems = [...CHALKBOARD_ITEMS, ...WINE_ITEMS];
    allItems.forEach(item => {
      const article = document.createElement('article'), text = document.createElement('div'), algSpan = document.createElement('div');
      text.innerHTML = `<b>• ${item.name}</b>`;
      algSpan.style.cssText = "color:#FF5733; font-weight:800; font-size:0.8rem; text-align:right; white-space:nowrap;";
      algSpan.textContent = getAlgs(item.name).join(', ');
      article.append(text, algSpan);
      box.append(article);
    });
    content.append(box);
    document.getElementById('status').textContent = '🟢 Pronto';
    return;
  }

  if (tab === 'vini') {
    const box = document.createElement('div');
    box.className = 'card-box';
    box.innerHTML = `<div class="brand-header">${LOGO_SVG}<h3 style="color:#FF5733; margin-top:8px; font-size:1.15rem;">🍷 CARTA DEI VINI 🍷</h3><p style="font-size:0.8rem; font-weight:700; color:#062329; margin-top:2px;">Selezione Cantine Abruzzesi & Artigianali</p></div>`;

    const categories = ['Bollicine & Metodo Classico', 'Vini Bianchi & Orange', 'Cerasuoli & Rosati', 'Vini Rossi & Montepulciano', 'Calici al vetro', 'Acqua, Birra & Caffetteria'];
    categories.forEach(catName => {
      const itemsInCat = WINE_ITEMS.filter(d => classifyWine(d.name) === catName);
      if(!itemsInCat.length) return;
      
      const h2 = document.createElement('h2');
      h2.textContent = catName;
      box.append(h2);

      itemsInCat.forEach(item => {
        const article = document.createElement('article'), text = document.createElement('div'), price = document.createElement('div');
        const tr = TRANSLATIONS[item.name]?.[lang];
        text.innerHTML = `<b>• ${tr || item.name}</b>`;
        if(tr) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }
        
        price.className = 'price';
        price.textContent = new Intl.NumberFormat(lang,{style:'currency',currency:'EUR'}).format(item.price);
        article.append(text, price);
        box.append(article);
      });
    });
    content.append(box);
    document.getElementById('status').textContent = '🟢 Pronto';
    return;
  }

  // Menù del giorno
  const box = document.createElement('div');
  box.className = 'card-box';
  box.innerHTML = `<div class="brand-header">${LOGO_SVG}<h3 style="color:#FF5733; margin-top:8px; font-size:1.2rem; letter-spacing:1px;">✨ MENÙ DEL GIORNO ✨</h3><p style="font-size:0.78rem; font-weight:700; color:#062329; margin-top:2px;">` + new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + `</p></div>`;

  const catsMap = ['3 Antipasti', '4 Primi Piatti', '5 Secondi', '6 Desserts'];
  const titlesMap = {
    it: ['Antipasti', 'Primi Piatti', 'Secondi & Contorni', 'Desserts'],
    en: ['Starters', 'First courses', 'Main courses & Sides', 'Desserts'],
    fr: ['Entrées', 'Premiers plats', 'Plats principaux & Accompagnements', 'Desserts'],
    de: ['Vorspeisen', 'Erste Gänge', 'Hauptgerichte & Beilagen', 'Desserts'],
    es: ['Entrantes', 'Primeros platos', 'Platos principales & Guarniciones', 'Postres']
  };

  catsMap.forEach((catCode, index) => {
    const rows = CHALKBOARD_ITEMS.filter(x => x.cat === catCode);
    if(!rows.length) return;

    const h2 = document.createElement('h2');
    h2.textContent = (titlesMap[lang] || titlesMap.it)[index];
    box.append(h2);

    rows.forEach(item => {
      const article = document.createElement('article'), text = document.createElement('div'), price = document.createElement('div');
      const tr = TRANSLATIONS[item.name]?.[lang];
      text.innerHTML = `<b>• ${tr || item.name}</b>`;
      if(tr) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }
      
      price.className = 'price';
      price.textContent = new Intl.NumberFormat(lang,{style:'currency',currency:'EUR'}).format(item.price);
      article.append(text, price);
      box.append(article);
    });
  });

  const footerNotice = document.createElement('div');
  footerNotice.style.cssText = "margin-top:18px; text-align:center; background:#1BE7FF; padding:10px; border-radius:10px; border:1.5px solid #FF5733; color:#062329; font-weight:800; font-size:0.84rem;";
  footerNotice.textContent = "🐟 Pane e Coperto € 3,00 — ENJOY! — 📞 392 3279000";
  box.append(footerNotice);

  content.append(box);
  document.getElementById('status').textContent = '🟢 Pronto';
}

switchTab('giorno');
</script></body></html>
