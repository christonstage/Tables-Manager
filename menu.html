let currentTab = 'giorno';

function classifyWine(name) {
  const n = name.toLowerCase();
  if (/calice/.test(n)) return 'Calici al vetro';
  if (/metodo classico|charmat|trabocco/.test(n)) return 'Bollicine & Metodo Classico';
  if (/cerasuolo|rosato|fossimatto/.test(n)) return 'Cerasuoli & Rosati';
  if (/montepulciano|pinto\s*11|maleducato\s*11|dire\s*bere|febbre\s*d'abruzzo/.test(n)) return 'Vini Rossi & Montepulciano';
  if (/trebbiano|pecorino|passerina|chardonnay|maiolica|orange|blondie|pane\s*al\s*pane/.test(n)) return 'Vini Bianchi & Orange';
  return 'Acqua, Birra & Caffetteria';
}

function getAlgs(name) {
  const n = name.toLowerCase();
  const algs = [];
  if (/pane|pasta|linguina|rigatoro|pizzell|cantucci|qubetto|pacchero|spaghetti|gnocch|farina|grano/i.test(n)) algs.push('Glutine');
  if (/granchio|panocchie|scampi|gamberi/i.test(n)) algs.push('Crostacei');
  if (/cozze|vongole|totanett|totanetti/i.test(n)) algs.push('Molluschi');
  if (/alici|alicette|baccalà|nasello|sgombro|pesce/i.test(n)) algs.push('Pesce');
  if (/uova|cace e ove|majo|maionese|tiramisù|zafferamisù/i.test(n)) algs.push('Uova');
  if (/formaggio|ricotta|gregoriano|latte|burro|cacio|pecorino|mozzarella/i.test(n)) algs.push('Latticini');
  if (/mandorle|nocciole|noci|pistacchio/i.test(n)) algs.push('Frutta a guscio');
  if (/senape/i.test(n)) algs.push('Senape');
  if (/doc|igt|vino|calice|cerasuolo|trebbiano|pecorino|montepulciano|passerina|chardonnay|bollicine|charmat/i.test(n)) algs.push('Solfiti');
  return algs.length > 0 ? algs : ['Nessun allergene maggiore dichiarato'];
}

  currentTab = tab;

function render() {

  if(currentTab==='vini') document.getElementById('btnVini').classList.add('active');
  if(currentTab==='allergeni') document.getElementById('btnAllergeni').classList.add('active');

    const allItems = [...CHALKBOARD_ITEMS, ...WINE_ITEMS];
    allItems.forEach(item => {
      const article = document.createElement('article'), text = document.createElement('div'), algSpan = document.createElement('div');
      const tr = TRANSLATIONS[item.name]?.[lang];
      text.innerHTML = `<b>• ${tr || item.name}</b>`;
      if(tr) { const sm = document.createElement('small'); sm.textContent = item.name; text.append(sm); }

      algSpan.style.cssText = "color:#FF5733; font-weight:800; font-size:0.8rem; text-align:right; white-space:nowrap;";
      algSpan.textContent = getAlgs(item.name).join(', ');
      article.append(text, algSpan);
      box.append(article);
    });
    content.append(box);
    return;
  }

  if(!RID)$('cBill').style.display='none';
  else if(!R)$('bill').innerHTML=`<div class="note">${t(window._noBill?'nobill':'wait')}</div>`;
  else $('bill').innerHTML=`<div class="note" style="margin:0 0 6px;">${esc(R.n)} · ${esc(R.h||'')}${R.cop?' · '+R.cop+' '+t('cov'):''}</div>`+(R.it||[]).map(i=>`<div class="row"><span>${i.q}× ${esc(i.n)}</span><b>${money(i.p*i.q)}</b></div>`).join('')+`<div class="tot"><span>${t('total')}</span><span>${money(R.tot)}</span></div>`;
  renderForm();
}
function cardView(p){const eur=Number(p&&p.eur)||0,pr=Math.round((eur%EUR)*100)/100,av=Number(p&&p.av)||0;
  $('fEur').textContent=money(eur);$('fBar').style.width=(pr/EUR*100)+'%';$('fNext').textContent=t('next')(money(EUR-pr).replace(/[^\d,.]/g,''));$('fGl').textContent='🥂'.repeat(Math.min(av,10));$('fAv').textContent=t('av')(av);}
function renderForm(){
  const f=$('fForm');if(window._sent){f.innerHTML='';return;}
  if(RID&&claimed){$('fMsg').textContent=t('claimed');f.innerHTML='';return;}
  if(!RID&&me&&!window._other){$('fMsg').textContent=t('hi')(me.name.split(/\s+/)[0]);f.innerHTML=`<button class="btn ghost" id="oth">${t('notMe')}</button>`;$('oth').onclick=()=>{window._other=true;renderForm();};return;}
  $('fMsg').textContent=RID?t('join'):t('joinC');
  if(me&&!window._other){f.innerHTML=`<button class="btn" id="go1">${t('add')(esc(me.name.split(/\s+/)[0]))}</button><button class="btn ghost" id="oth">${t('other')}</button>`;$('go1').onclick=()=>send({...me,mkt:me.mkt,priv:true});$('oth').onclick=()=>{window._other=true;renderForm();};return;}
  const days='<option value="">'+t('day')+'</option>'+Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1}</option>`).join(''),mons='<option value="">'+t('month')+'</option>'+t('months').map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('');
  f.innerHTML=`<label>${t('name')}</label><input id="nm" autocomplete="name"><label>${t('phone')}</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="333 123 4567"><label>${t('bday')}</label><div class="two"><select id="bd">${days}</select><select id="bm">${mons}</select></div><label>${t('email')}</label><input id="em" type="email" autocomplete="email"><label class="check"><input type="checkbox" id="priv"><span>${t('priv')}</span></label><label class="check"><input type="checkbox" id="mkt"><span>${t('mkt')}</span></label><details><summary>${t('info')}</summary><p>${t('infoT')}</p></details><button class="btn" id="go2">${RID?t('go'):t('goC')}</button>`;
  $('go2').onclick=()=>{const name=$('nm').value.trim(),d=digits($('ph').value),email=$('em').value.trim(),bday=($('bm').value&&$('bd').value)?$('bm').value+'-'+$('bd').value:'';
    if(name.length<2)return $('err').textContent=t('eName');if(d.length<8||d.length>13)return $('err').textContent=t('ePhone');if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return $('err').textContent=t('eMail');if(!$('priv').checked)return $('err').textContent=t('ePriv');
    send({name:name.slice(0,60),phone:d,email,bday,mkt:$('mkt').checked,priv:true});};
}
async function send(p){
  $('err').textContent='';const b=document.querySelector('#fForm .btn');if(b){b.disabled=true;b.textContent=t('adding');}
  const body={...(RID?{rid:RID}:{}),name:p.name,phone:p.phone,mkt:!!p.mkt,priv:true,ts:Date.now()};if(p.email)body.email=p.email.slice(0,80);if(p.bday)body.bday=p.bday;
  try{const r=await fetch(FB+'/fidelity/inbox.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;
    me={name:p.name,phone:p.phone,email:p.email||'',mkt:!!p.mkt};localStorage.setItem('alicetta_fid_me',JSON.stringify(me));window._sent=true;window._other=false;renderForm();$('fMsg').textContent=RID?t('sent'):t('sentC');watch(p.phone);}
  catch(e){if(b){b.disabled=false;b.textContent=me&&!window._other&&RID?t('add')(me.name.split(/\s+/)[0]):(RID?t('go'):t('goC'));}$('err').textContent=t('eNet');}
}
async function readPub(phone){try{const r=await fetch(FB+'/fidelity/pub/'+await pubKey(phone)+'.json?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;}catch(e){return null;}}
async function watch(phone){const start=Date.now(),before=await readPub(phone),b0=before?Number(before.eur)||0:-1;cardView(before);if(!RID&&before){$('fMsg').textContent=t('joined');return;}
  const tick=async()=>{const p=await readPub(phone);if(p&&(Number(p.eur)||0)!==b0){cardView(p);$('fEur').classList.add('pop');$('fMsg').textContent=RID?t('done'):t('joined');return;}if(Date.now()-start>90000){$('fMsg').textContent=t('later');return;}setTimeout(tick,4000);};setTimeout(tick,3000);}
async function loadBill(n){if(!RID)return;try{const r=await fetch(FB+'/ricevute/'+RID+'.json?t='+Date.now(),{cache:'no-store'});const d=r.ok?await r.json():null;if(d){R=d;claimed=!!d.claimed;paint();return;}}catch(e){}if(n<10)setTimeout(()=>loadBill(n+1),3000);else{window._noBill=true;paint();}}
if(!RID){const w=document.querySelector('.wrap');w.insertBefore($('cFid'),$('cReview'));}
document.documentElement.lang=L;paint();loadBill(0);if(me)readPub(me.phone).then(p=>{if(p)cardView(p);});else cardView(null);

window.setLang=setLang;
})();
</script>
</body>
