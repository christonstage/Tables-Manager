<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christian Carafa – Alicetta Trattoria</title>
<meta name="description" content="Biglietto da visita di Christian Carafa, Alicetta Trattoria, Fossacesia.">
<meta property="og:title" content="Christian Carafa – Alicetta Trattoria">
<meta property="og:description" content="Contatti, mappa e dati per la fattura di Alicetta Trattoria, Fossacesia.">
<meta name="theme-color" content="#8CC0D4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --schiuma:#FFF7EF; --adriatico:#14485A; --adriatico2:#1B5C70; --cielo:#8CC0D4; --cielo2:#A6D0E0; --corallo:#D96C4E; --corallo-lip:#A84B31;
  --acqua:#0EA5B7; --argento:#C9D8DE; --ink:#0F172A; --muted:#5B6B7C;
  --page:var(--schiuma); --tile:#FFFFFF; --tile-lip:#E7D5C6; --line:#F1E2D6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--page:#08151B; --tile:#12252E; --tile-lip:#081319; --line:#1D3640; --ink:#EEF6F8; --muted:#9DB3BC; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;line-height:1.4;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:18px 16px 34px}

/* il biglietto */
.card{position:relative;border-radius:22px;padding:0 0 20px;color:#0F2F38;
  background:linear-gradient(180deg,var(--cielo) 0%,var(--cielo) 58%,var(--cielo2) 100%);
  box-shadow:0 7px 0 #5E93A8,0 24px 44px rgba(20,72,90,.35),inset 0 1px 0 rgba(255,255,255,.55);
  overflow:hidden;transform-origin:50% 100%;animation:posa .7s cubic-bezier(.2,.9,.25,1.1) both}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:22px;
  background:radial-gradient(90% 60% at 50% 0%,rgba(255,255,255,.18),transparent 70%)}
@keyframes posa{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(18px)}to{opacity:1;transform:none}}
.brand{display:block;width:100%;height:auto;border-radius:22px 22px 0 0}
.info{position:relative;z-index:1;padding:4px 22px 0}
.rule{width:44px;height:4px;border-radius:4px;background:var(--corallo);margin:4px 0 12px}
.who{margin:0;font-weight:800;font-size:1.28rem}
.role{margin:2px 0 0;font-weight:700;color:#2F5866}
.tel{display:inline-block;margin-top:12px;font-weight:800;font-size:1.05rem;color:#0F2F38;text-decoration:none;font-variant-numeric:tabular-nums}

/* azioni */
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;padding:17px 14px 20px;border:0;border-radius:16px;
  background:var(--corallo);color:#fff;font:inherit;font-weight:800;font-size:1.08rem;cursor:pointer;
  box-shadow:inset 0 -5px 0 var(--corallo-lip),inset 0 2px 0 rgba(255,255,255,.35),0 10px 20px rgba(232,87,46,.32);transition:transform .09s,box-shadow .09s}
.save:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--corallo-lip),0 3px 8px rgba(232,87,46,.3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:86px;padding:12px 6px 15px;border-radius:16px;
  background:var(--tile);color:var(--ink);text-decoration:none;font-weight:800;font-size:.9rem;text-align:center;
  box-shadow:inset 0 -4px 0 var(--tile-lip),0 8px 16px rgba(60,30,10,.10);transition:transform .09s,box-shadow .09s}
.tile:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 var(--tile-lip),0 2px 6px rgba(60,30,10,.12)}
.tile svg{width:26px;height:26px;stroke:var(--acqua);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wide{flex-direction:row;gap:12px;min-height:0;padding:16px 14px 19px;margin-top:10px;font-size:1rem}
.wide.map{background:var(--adriatico);color:var(--schiuma);box-shadow:inset 0 -4px 0 #051E24,0 10px 20px rgba(5,30,36,.25)}
.wide.map svg{stroke:#7BE6F2}
.wide small{display:block;font-weight:500;font-size:.8rem;opacity:.8}
.wide span{text-align:left}
.social{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
[hidden]{display:none!important}

/* dati fiscali */
h2{font-size:1.02rem;font-weight:800;margin:28px 0 4px}
.hint{margin:0 0 8px;color:var(--muted);font-size:.86rem}
.rows{background:var(--tile);border-radius:16px;box-shadow:inset 0 -4px 0 var(--tile-lip),0 8px 16px rgba(60,30,10,.08);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0;padding-bottom:17px}
.row small{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.row b{display:block;margin-top:1px;font-weight:800;font-size:1rem;word-break:break-all;font-variant-numeric:tabular-nums}
.row i{font-style:normal;flex:none;font-size:.78rem;font-weight:800;color:var(--acqua);border:2px solid currentColor;border-radius:999px;padding:4px 10px}
.row.ok i{color:#fff;background:#16A34A;border-color:#16A34A}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:.82rem}
footer a{color:inherit}
:focus-visible{outline:3px solid var(--acqua);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{animation:none}.save,.tile{transition:none}}
</style>
</head>
