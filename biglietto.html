<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christian Carafa – Alicetta Trattoria</title>
<meta name="description" content="Biglietto da visita di Christian Carafa, Alicetta Trattoria, Fossacesia.">
<meta property="og:title" content="Christian Carafa – Alicetta Trattoria">
<meta property="og:description" content="Contatti, mappa e dati per la fattura di Alicetta Trattoria, Fossacesia.">
<meta name="theme-color" content="#0B3A44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --schiuma:#FFF7EF; --adriatico:#0B3A44; --adriatico2:#0E5563; --corallo:#E8572E; --corallo-lip:#A93A1A;
  --acqua:#0EA5B7; --argento:#C9D8DE; --ink:#0F172A; --muted:#5B6B7C;
  --page:var(--schiuma); --tile:#FFFFFF; --tile-lip:#E7D5C6; --line:#F1E2D6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--page:#08151B; --tile:#12252E; --tile-lip:#081319; --line:#1D3640; --ink:#EEF6F8; --muted:#9DB3BC; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;line-height:1.4;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:18px 16px 34px}

/* il biglietto */
.card{position:relative;border-radius:22px;padding:22px 22px 20px;color:var(--schiuma);
  background:linear-gradient(155deg,var(--adriatico2) 0%,var(--adriatico) 62%,#072A32 100%);
  box-shadow:0 7px 0 #051E24,0 24px 44px rgba(5,30,36,.38),inset 0 1px 0 rgba(255,255,255,.22);
  overflow:hidden;transform-origin:50% 100%;animation:posa .7s cubic-bezier(.2,.9,.25,1.1) both}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 100% 0%,rgba(56,215,234,.22),transparent 60%)}
@keyframes posa{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(18px)}to{opacity:1;transform:none}}
.mark{display:block;width:108px;height:auto;margin:0 0 8px -2px}
.logo{display:none;max-width:150px;max-height:84px;margin:0 0 10px;border-radius:10px}
.wordmark{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-style:italic;font-weight:600;font-size:3.1rem;line-height:.95;letter-spacing:-.01em;margin:0}
.place{margin:6px 0 0;font-weight:700;font-size:.98rem;color:var(--argento)}
.rule{width:44px;height:4px;border-radius:4px;background:var(--corallo);margin:18px 0 14px}
.who{margin:0;font-weight:800;font-size:1.28rem}
.role{margin:2px 0 0;font-weight:700;color:var(--argento)}
.tel{display:inline-block;margin-top:12px;font-weight:800;font-size:1.05rem;color:var(--schiuma);text-decoration:none;font-variant-numeric:tabular-nums}

/* azioni */
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;padding:17px 14px 20px;border:0;border-radius:16px;
  background:var(--corallo);color:#fff;font:inherit;font-weight:800;font-size:1.08rem;cursor:pointer;
  box-shadow:inset 0 -5px 0 var(--corallo-lip),inset 0 2px 0 rgba(255,255,255,.35),0 10px 20px rgba(232,87,46,.32);transition:transform .09s,box-shadow .09s}
.save:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--corallo-lip),0 3px 8px rgba(232,87,46,.3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:86px;padding:12px 6px 15px;border-radius:16px;
  background:var(--tile);color:var(--ink);text-decoration:none;font-weight:800;font-size:.9rem;text-align:center;
  box-shadow:inset 0 -4px 0 var(--tile-lip),0 8px 16px rgba(60,30,10,.10);transition:transform .09s,box-shadow .09s}
.tile:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 var(--tile-lip),0 2px 6px rgba(60,30,10,.12)}
.tile svg{width:26px;height:26px;stroke:var(--acqua);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wide{flex-direction:row;gap:12px;min-height:0;padding:16px 14px 19px;margin-top:10px;font-size:1rem}
.wide.map{background:var(--adriatico);color:var(--schiuma);box-shadow:inset 0 -4px 0 #051E24,0 10px 20px rgba(5,30,36,.25)}
.wide.map svg{stroke:#7BE6F2}
.wide small{display:block;font-weight:500;font-size:.8rem;opacity:.8}
.wide span{text-align:left}
.social{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
[hidden]{display:none!important}

/* dati fiscali */
h2{font-size:1.02rem;font-weight:800;margin:28px 0 4px}
.hint{margin:0 0 8px;color:var(--muted);font-size:.86rem}
.rows{background:var(--tile);border-radius:16px;box-shadow:inset 0 -4px 0 var(--tile-lip),0 8px 16px rgba(60,30,10,.08);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0;padding-bottom:17px}
.row small{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.row b{display:block;margin-top:1px;font-weight:800;font-size:1rem;word-break:break-all;font-variant-numeric:tabular-nums}
.row i{font-style:normal;flex:none;font-size:.78rem;font-weight:800;color:var(--acqua);border:2px solid currentColor;border-radius:999px;padding:4px 10px}
.row.ok i{color:#fff;background:#16A34A;border-color:#16A34A}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:.82rem}
footer a{color:inherit}
:focus-visible{outline:3px solid var(--acqua);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{animation:none}.save,.tile{transition:none}}
</style>
</head>
<body>
<main>
  <section class="card" aria-label="Biglietto da visita">
    <img class="logo" id="logo" alt="Alicetta Trattoria" src="logo-alicetta.png">
    <svg class="mark" id="mark" viewBox="0 0 120 40" aria-hidden="true">
      <path d="M6 20C20 6 60 3 90 15l22-10-6 15 6 15-22-10C60 37 20 34 6 20Z" fill="rgba(201,216,222,.16)" stroke="#C9D8DE" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M32 20h54" stroke="#7BE6F2" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M28 10c3 6 3 14 0 20" stroke="#C9D8DE" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="19" cy="17.5" r="2.4" fill="#FFF7EF"/>
    </svg>
    <h1 class="wordmark">Alicetta</h1>
    <p class="place">Trattoria a Fossacesia</p>
    <div class="rule"></div>
    <p class="who">Christian Carafa</p>
    <p class="role">Titolare</p>
    <a class="tel" href="tel:+393923279000">+39 392 327 9000</a>
  </section>

  <button class="save" id="save" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c1-4 4-6 7.5-6 1.6 0 3 .4 4.200 1.100M18 14v7M14.500 17.500h7"/></svg>
    Salva nei contatti
  </button>

  <div class="grid">
    <a class="tile" href="tel:+393923279000"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>Chiama</a>
    <a class="tile" href="https://wa.me/393923279000" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.300-4.200A8 8 0 1 1 8.300 19L4 20Z"/><path d="M9 9.500c.300 2.500 2 4.500 5 5.500"/></svg>WhatsApp</a>
    <a class="tile" href="mailto:alicettatrattoria@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 8l8 6 8-6"/></svg>Email</a>
  </div>

  <a class="tile wide map" href="https://g.page/r/CU8mTr5r3HReEBM" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
    <span>Portami da Alicetta<small>Apre Google Maps</small></span>
  </a>

  <div class="grid social">
    <a class="tile" id="ig" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.500" y="3.500" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.200" cy="6.800" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
    <a class="tile" id="fb" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8.500V7a2 2 0 0 1 2-2h1.500M10 12.500h6M13 21v-12.500"/><rect x="3.500" y="3.500" width="17" height="17" rx="5"/></svg>Facebook</a>
    <a class="tile" href="https://www.facebook.com/share/1ENdzUr1iF/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.500" r="4"/><path d="M4.500 20.500c1-4 4-6 7.500-6s6.500 2 7.500 6"/></svg>Christian su Facebook</a>
  </div>

  <a class="tile wide" href="menu.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6a2 2 0 0 0 4 0V3M8 3v18M17 3c-2 2-3 4.500-3 8h3v10"/></svg><span>Guarda il menù di oggi</span></a>

  <h2>Dati per la fattura</h2>
  <p class="hint">Tocca una riga per copiarla.</p>
  <div class="rows">
    <button class="row" type="button" data-copy="02446950699"><span><small>Partita IVA</small><b>02446950699</b></span><i>Copia</i></button>
    <button class="row" type="button" data-copy="M5UXCR1"><span><small>Codice univoco (SDI)</small><b>M5UXCR1</b></span><i>Copia</i></button>
    <button class="row" type="button" data-copy="cadimasnc@legalmail.it"><span><small>PEC</small><b>cadimasnc@legalmail.it</b></span><i>Copia</i></button>
    <button class="row" type="button" data-copy="alicettatrattoria@gmail.com"><span><small>Email</small><b>alicettatrattoria@gmail.com</b></span><i>Copia</i></button>
  </div>

  <footer>Alicetta Trattoria, Fossacesia (CH)</footer>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  /* logo: se nel sito c'è il file logo-alicetta.png prende il posto del pesciolino */
  var lg=$('logo');
  lg.onload=function(){if(lg.naturalWidth>1){lg.style.display='block';$('mark').style.display='none';}};
  lg.onerror=function(){lg.remove();};
  /* Instagram e Facebook del locale arrivano dall'indirizzo: ?ig=nome&fb=nome */
  var q=new URLSearchParams(location.search);
  function clean(v){return String(v||'').trim().replace(/^(https?:\/\/)?(www\.|m\.)?(instagram|facebook)\.com\//i,'').replace(/^@/,'').replace(/[?#].*$/,'').replace(/\/+$/,'');}
  var ig=clean(q.get('ig')),fb=clean(q.get('fb'));
  if(ig&&/^[\w.\-\/]+$/.test(ig)){$('ig').href='https://www.instagram.com/'+ig+'/';$('ig').hidden=false;}
  if(fb&&/^[\w.\-\/]+$/.test(fb)){$('fb').href='https://www.facebook.com/'+fb;$('fb').hidden=false;}
  /* copia dei dati fiscali */
  document.querySelectorAll('.row').forEach(function(r){r.addEventListener('click',function(){
    var t=r.getAttribute('data-copy'),done=function(){var i=r.querySelector('i');r.classList.add('ok');i.textContent='Copiato';setTimeout(function(){r.classList.remove('ok');i.textContent='Copia';},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t);done();});}else{fallback(t);done();}
  });});
  function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}
  /* salva nei contatti: scarica una vCard */
  $('save').addEventListener('click',function(){
    var L=['BEGIN:VCARD','VERSION:3.0','N:Carafa;Christian;;;','FN:Christian Carafa','ORG:Alicetta Trattoria','TITLE:Titolare',
      'TEL;TYPE=CELL,VOICE:+393923279000','EMAIL;TYPE=WORK:alicettatrattoria@gmail.com','EMAIL;TYPE=OTHER:cadimasnc@legalmail.it',
      'ADR;TYPE=WORK:;;;Fossacesia;CH;66022;Italia','URL:https://g.page/r/CU8mTr5r3HReEBM',
      'NOTE:Alicetta Trattoria\\, Fossacesia. P.IVA 02446950699 - Codice univoco M5UXCR1 - PEC cadimasnc@legalmail.it','END:VCARD'];
    var b=new Blob([L.join('\r\n')],{type:'text/vcard;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='Christian-Carafa-Alicetta.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
  });
})();
</script>
</body>
</html>
