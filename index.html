<!-- ===== v2.5.2: Numerazione righe Sinistra/Destra, Rubrica Fornitori da Bolle, Prenotazioni da WhatsApp ===== -->
<style id="v252style">
/* 1. Numerazione righe sinistra (piatto) e destra (cursori / controlli) */
.v252-row-numbered {
  position: relative;
  padding-left: 6px !important;
  padding-right: 6px !important;
  border-radius: 8px;
  transition: background-color 0.15s;
}
.v252-row-numbered:nth-of-type(even) {
  background-color: rgba(6, 35, 41, 0.045);
}
.v252-row-numbered:active,
.v252-row-numbered:focus-within {
  background-color: rgba(27, 231, 255, 0.22) !important;
  outline: 1.5px solid var(--logo-coral, #FF5733);
}
.v252-num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 22px;
  padding: 0 5px;
  border-radius: 6px;
  background: #062329;
  color: #1BE7FF;
  font-size: 0.72rem;
  font-weight: 900;
  line-height: 1;
  margin-right: 6px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}
.v252-num-badge.right {
  background: var(--logo-coral, #FF5733);
  color: #FFFFFF;
  margin-right: 0;
  margin-left: 6px;
}

/* 2. Stili Rubrica Fornitori */
.forn-card {
  background: #FFFFFF;
  border: 1.5px solid rgba(6, 35, 41, 0.12);
  border-radius: 14px;
  padding: 10px 12px;
  margin-bottom: 8px;
  box-shadow: 0 3px 0 rgba(6, 35, 41, 0.1);
}
.forn-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.forn-title {
  font-weight: 900;
  font-size: 0.95rem;
  color: #062329;
}
.forn-meta {
  font-size: 0.74rem;
  color: #4B5563;
  font-weight: 700;
  margin-top: 2px;
  line-height: 1.35;
}
.forn-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.forn-tag {
  font-size: 0.68rem;
  font-weight: 800;
  background: #F1F5F9;
  color: #0F172A;
  padding: 2px 7px;
  border-radius: 12px;
}
.forn-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

/* 3. Box WhatsApp Prenotazioni */
.wa-res-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 10px;
  padding: 8px;
  background: #DCFCE7;
  border: 2px solid #22C55E;
  border-radius: 12px;
}
.btn-wa-res {
  background: #16A34A;
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  padding: 9px 8px;
  font-weight: 900;
  font-size: 0.8rem;
  cursor: pointer;
  box-shadow: 0 3px 0 #14532D;
}
.btn-wa-res.alt {
  background: #062329;
  color: #1BE7FF;
  box-shadow: 0 3px 0 #000000;
}
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);

  /* =========================================================================
     1. NUMERAZIONE SINISTRA (PIATTO) E DESTRA (CURSORI / PULSANTI +/-)
     ========================================================================= */
  function numberContainerRows(container) {
    if (!container) return;
    // Seleziona righe di piatti/controlli (cart-row, ing, fc, bl-row o righe con range/slider)
    const rows = Array.from(container.querySelectorAll('.cart-row, .ing, .fc, .bl-row')).filter(r => {
      // Numeriamo solo le righe che hanno controlli a destra (bottoni +/-, input range o input numerici)
      return r.querySelector('.cart-controls, input[type="range"], .btn-qty, input[type="number"], .fc-pct, .p');
    });

    // Supporto anche per eventuali righe custom con slider (input[type="range"]) non dentro .cart-row
    const rangeInputs = Array.from(container.querySelectorAll('input[type="range"]'));
    rangeInputs.forEach(rng => {
      const row = rng.closest('.cart-row, .ing, .fc, div[style*="flex"], div[style*="grid"]');
      if (row && !rows.includes(row)) rows.push(row);
    });

    rows.forEach((row, idx) => {
      const n = idx + 1;
      row.classList.add('v252-row-numbered');

      // Badge Sinistro (accanto al nome del piatto)
      let leftBadge = row.querySelector(':scope .v252-num-badge.left');
      if (!leftBadge) {
        leftBadge = document.createElement('span');
        leftBadge.className = 'v252-num-badge left';
        const leftTarget = row.querySelector('.cart-info, .n, .fc-top b, b, span') || row.firstElementChild;
        if (leftTarget) {
          leftTarget.insertBefore(leftBadge, leftTarget.firstChild);
        } else {
          row.insertBefore(leftBadge, row.firstChild);
        }
      }
      if (leftBadge.textContent !== '#' + n) leftBadge.textContent = '#' + n;

      // Badge Destro (accanto al cursore o ai pulsanti - / +)
      let rightBadge = row.querySelector(':scope .v252-num-badge.right');
      if (!rightBadge) {
        rightBadge = document.createElement('span');
        rightBadge.className = 'v252-num-badge right';
        const rightTarget = row.querySelector('.cart-controls, .p, .fc-pct') ||
                            (row.querySelector('input[type="range"]') && row.querySelector('input[type="range"]').parentElement);
        if (rightTarget) {
          rightTarget.appendChild(rightBadge);
        } else {
          row.appendChild(rightBadge);
        }
      }
      if (rightBadge.textContent !== '#' + n) rightBadge.textContent = '#' + n;
    });
  }

  function refreshAllRowNumbers() {
    [
      'stockPanel', 'cartContainer', 'menuMgrList', 'dishList',
      'viewAi', 'viewSales', 'v211Box'
    ].forEach(id => {
      const el = $(id);
      if (el) numberContainerRows(el);
    });
  }

  // Osservatore automatico per numerare qualsiasi schermata appena si aggiorna
  let numTimer = null;
  const rowObserver = new MutationObserver(() => {
    clearTimeout(numTimer);
    numTimer = setTimeout(refreshAllRowNumbers, 60);
  });
  window.addEventListener('DOMContentLoaded', () => {
    rowObserver.observe(document.body, { childList: true, subtree: true });
    setTimeout(refreshAllRowNumbers, 500);
  });
  setTimeout(() => {
    if (document.body) rowObserver.observe(document.body, { childList: true, subtree: true });
    refreshAllRowNumbers();
  }, 500);


  /* =========================================================================
     2. RUBRICA FORNITORI AUTOMATICA DA BOLLE & FATTURE
     ========================================================================= */
  const FORN_KEY = 'alicetta_fornitori_v1';

  function loadFornitoriLocal() {
    try {
      return JSON.parse(localStorage.getItem(FORN_KEY) || '{}') || {};
    } catch (e) {
      return {};
    }
  }

  function saveFornitoriLocal(data) {
    localStorage.setItem(FORN_KEY, JSON.stringify(data || {}));
  }

  async function syncFornitoreToCloud(id, obj) {
    const all = loadFornitoriLocal();
    if (obj === null) delete all[id];
    else all[id] = obj;
    saveFornitoriLocal(all);
    try {
      if (typeof fbSend === 'function') {
        await fbSend('/costi/fornitori/' + id, obj === null ? 'DELETE' : 'PUT', obj === null ? undefined : obj);
      }
    } catch (e) {}
  }

  async function pullFornitoriFromCloud() {
    try {
      if (typeof fbGet === 'function' && navigator.onLine) {
        const remote = await fbGet('/costi/fornitori');
        if (remote && typeof remote === 'object') {
          const loc = loadFornitoriLocal();
          const merged = { ...remote, ...loc };
          saveFornitoriLocal(merged);
        }
      }
    } catch (e) {}
  }

  const fornIdFromName = name => String(name || '').toLowerCase().trim().replace(/[^a-z0-9àèéìòù]/g, '');

  // Unisce i fornitori salvati con quelli estratti da tutte le bolle in memoria
  function getFullRubricaFornitori() {
    const rub = loadFornitoriLocal();
    let bolle = {};
    try {
      const c = JSON.parse(localStorage.getItem('alicetta_costi') || '{}');
      bolle = c.bolle || {};
    } catch (e) {}

    const stats = {};
    Object.values(bolle).forEach(b => {
      if (!b || !b.fornitore) return;
      const fid = fornIdFromName(b.fornitore);
      if (!fid) return;
      if (!stats[fid]) {
        stats[fid] = { nome: b.fornitore.trim(), bolleCount: 0, totSpesa: 0, lastDate: '', items: new Set() };
      }
      stats[fid].bolleCount++;
      if (b.data && b.data > stats[fid].lastDate) stats[fid].lastDate = b.data;
      (b.righe || []).forEach(r => {
        const q = parseFloat(r.q) || 1;
        const pu = parseFloat(r.pu) || 0;
        stats[fid].totSpesa += q * pu;
        if (r.i || r.p) stats[fid].items.add((r.i || r.p).trim());
      });
      // Se nella bolla erano salvati contatti, li recupera
      if (b.contatti && typeof b.contatti === 'object') {
        rub[fid] = mergeFornContact(rub[fid] || { nome: b.fornitore.trim() }, b.contatti);
      }
    });

    // Assicura che ogni fornitore presente nelle bolle esista nella rubrica
    let changed = false;
    Object.entries(stats).forEach(([fid, st]) => {
      if (!rub[fid]) {
        rub[fid] = { id: fid, nome: st.nome, tel: '', email: '', pec: '', piva: '', addr: '', note: '', updatedAt: Date.now() };
        changed = true;
      }
    });
    if (changed) saveFornitoriLocal(rub);

    return Object.entries(rub).map(([fid, f]) => {
      const st = stats[fid] || { bolleCount: 0, totSpesa: 0, lastDate: '', items: new Set() };
      return {
        ...f,
        id: fid,
        nome: f.nome || st.nome || fid,
        bolleCount: st.bolleCount,
        totSpesa: st.totSpesa,
        lastDate: st.lastDate,
        prodotti: Array.from(st.items).slice(0, 12)
      };
    }).sort((a, b) => (b.bolleCount - a.bolleCount) || String(a.nome).localeCompare(String(b.nome), 'it'));
  }

  function mergeFornContact(oldObj, newC) {
    const out = { ...oldObj };
    if (newC.fornitore && !out.nome) out.nome = String(newC.fornitore).trim();
    if (newC.telefono && !out.tel) out.tel = String(newC.telefono).trim();
    if (newC.email && !out.email) out.email = String(newC.email).trim();
    if (newC.pec && !out.pec) out.pec = String(newC.pec).trim();
    if (newC.piva && !out.piva) out.piva = String(newC.piva).replace(/^IT/i, '').trim();
    if (newC.indirizzo && !out.addr) out.addr = String(newC.indirizzo).trim();
    out.updatedAt = Date.now();
    return out;
  }

  // Intercetta la chiamata Gemini sulle bolle per estrarre in automatico anche i contatti del fornitore
  if (typeof window.callGemini === 'function') {
    const _origCallGemini = window.callGemini;
    window.callGemini = async function(parts, json) {
      let isBollaPrompt = false;
      if (Array.isArray(parts) && parts[0] && typeof parts[0].text === 'string' && parts[0].text.includes('Leggi questo documento di acquisto')) {
        isBollaPrompt = true;
        parts[0].text = parts[0].text.replace(
          'Restituisci SOLO JSON:',
          'Estrai anche eventuali dati di contatto del fornitore presenti nell\'intestazione o a piè di pagina (telefono, email, pec, piva, indirizzo). Restituisci SOLO JSON includendo anche la chiave opzionale "contatti":{"telefono":"","email":"","pec":"","piva":"","indirizzo":""}:'
        );
      }
      const res = await _origCallGemini.apply(this, arguments);
      if (isBollaPrompt && res) {
        try {
          const parsed = JSON.parse(res.slice(res.indexOf('{'), res.lastIndexOf('}') + 1));
          if (parsed && parsed.fornitore) {
            const fid = fornIdFromName(parsed.fornitore);
            if (fid) {
              const all = loadFornitoriLocal();
              const updated = mergeFornContact(all[fid] || { id: fid, nome: parsed.fornitore.trim() }, {
                fornitore: parsed.fornitore,
                ...(parsed.contatti || {})
              });
              await syncFornitoreToCloud(fid, updated);
              setTimeout(renderRubricaFornitoriUI, 300);
            }
          }
        } catch (e) {}
      }
      return res;
    };
  }

  // Scansione rapida dedicata: scatta foto a bolla/fattura/biglietto per salvare il fornitore
  window.v252ScanFornitorePhoto = function() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.capture = 'environment';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (!getGeminiKey()) return alert('Inserisci la chiave Gemini in ⚙️ Opzioni per leggere le foto.');
      const st = $('v252FornStatus');
      if (st) { st.style.display = 'block'; st.textContent = '⏳ Estrazione dati e contatti fornitore dalla foto...'; }
      try {
        const b64 = await shrinkImage(f, 1600);
        const txt = await callGemini([{
          text: 'Da questa bolla, fattura o biglietto da visita di un fornitore ristorante estrai i dati anagrafici e di contatto. Rispondi SOLO in JSON: {"nome":"ragione sociale o nome breve","telefono":"numero fisso o cellulare","email":"email","pec":"pec","piva":"solo 11 cifre","indirizzo":"via, cap e città","note":"eventuale categoria merceologica es. Ittico, Vini, Ortofrutta"}',
          inline_data: undefined
        }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }], true);
        const o = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        if (!o.nome) throw new Error('Nome fornitore non trovato nella foto');
        const fid = fornIdFromName(o.nome);
        const all = loadFornitoriLocal();
        const merged = mergeFornContact(all[fid] || { id: fid, nome: o.nome.trim() }, o);
        if (o.note && !merged.note) merged.note = o.note;
        await syncFornitoreToCloud(fid, merged);
        if (st) st.textContent = '✅ Fornitore "' + merged.nome + '" salvato in rubrica!';
        renderRubricaFornitoriUI();
      } catch (e) {
        if (st) st.textContent = '❌ Errore lettura: ' + e.message;
      }
    };
    inp.click();
  };

  window.v252EditFornitore = function(fid) {
    const all = loadFornitoriLocal();
    const cur = (fid && all[fid]) || { nome: '', tel: '', email: '', pec: '', piva: '', addr: '', note: '' };
    let ov = $('v252FornModal');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'v252FornModal';
      ov.className = 'modal-overlay';
      document.body.appendChild(ov);
    }
    ov.innerHTML = `
      <div class="receipt-box">
        <h3 style="color:var(--logo-coral);margin-bottom:8px;">📦 ${fid ? 'Modifica Fornitore' : 'Nuovo Fornitore'}</h3>
        <label style="font-size:.75rem;font-weight:800;">Nome / Ragione Sociale *</label>
        <input id="vf_nome" class="form-control" style="margin-bottom:6px;" value="${escH(cur.nome || '')}" placeholder="Es. Ittica Adriatica">
        <label style="font-size:.75rem;font-weight:800;">Telefono / Cellulare WhatsApp</label>
        <input id="vf_tel" class="form-control" type="tel" style="margin-bottom:6px;" value="${escH(cur.tel || '')}" placeholder="Es. 333 1234567">
        <label style="font-size:.75rem;font-weight:800;">Email ordini</label>
        <input id="vf_email" class="form-control" type="email" style="margin-bottom:6px;" value="${escH(cur.email || '')}" placeholder="ordini@fornitore.it">
        <label style="font-size:.75rem;font-weight:800;">PEC</label>
        <input id="vf_pec" class="form-control" type="email" style="margin-bottom:6px;" value="${escH(cur.pec || '')}">
        <label style="font-size:.75rem;font-weight:800;">Partita IVA</label>
        <input id="vf_piva" class="form-control" style="margin-bottom:6px;" value="${escH(cur.piva || '')}">
        <label style="font-size:.75rem;font-weight:800;">Indirizzo / Città</label>
        <input id="vf_addr" class="form-control" style="margin-bottom:6px;" value="${escH(cur.addr || '')}">
        <label style="font-size:.75rem;font-weight:800;">Note (Giorni consegna, Agente, ecc.)</label>
        <input id="vf_note" class="form-control" style="margin-bottom:10px;" value="${escH(cur.note || '')}" placeholder="Es. Consegna Mar/Ven entro le 11">
        <div class="modal-actions">
          <button class="btn-modal" style="background:#10b981;color:#fff;" onclick="v252SaveFornitore('${escH(fid || '')}')">💾 Salva</button>
          ${fid ? `<button class="btn-modal" style="background:#FEE2E2;color:#991B1B;flex:0.6;" onclick="v252DeleteFornitore('${escH(fid)}')">🗑️</button>` : ''}
          <button class="btn-modal" style="background:#334155;color:#fff;flex:0.6;" onclick="document.getElementById('v252FornModal').classList.remove('active')">Chiudi</button>
        </div>
      </div>`;
    ov.classList.add('active');
  };

  window.v252SaveFornitore = async function(oldFid) {
    const nome = ($('vf_nome').value || '').trim();
    if (!nome) return alert('Inserisci il nome del fornitore.');
    const fid = oldFid || fornIdFromName(nome);
    const obj = {
      id: fid,
      nome,
      tel: ($('vf_tel').value || '').trim(),
      email: ($('vf_email').value || '').trim(),
      pec: ($('vf_pec').value || '').trim(),
      piva: ($('vf_piva').value || '').trim(),
      addr: ($('vf_addr').value || '').trim(),
      note: ($('vf_note').value || '').trim(),
      updatedAt: Date.now()
    };
    await syncFornitoreToCloud(fid, obj);
    $('v252FornModal').classList.remove('active');
    renderRubricaFornitoriUI();
  };

  window.v252DeleteFornitore = async function(fid) {
    if (!confirm('Eliminare questo fornitore dalla rubrica?')) return;
    await syncFornitoreToCloud(fid, null);
    $('v252FornModal').classList.remove('active');
    renderRubricaFornitoriUI();
  };

  function renderRubricaFornitoriUI() {
    const host = $('hub_sales_forn');
    if (!host) return;
    let box = $('v252RubricaFornBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'v252RubricaFornBox';
      box.className = 'cart-section';
      host.insertBefore(box, host.firstChild);
    }
    const q = (($('v252FornSearch') || {}).value || '').toLowerCase().trim();
    const list = getFullRubricaFornitori().filter(f =>
      !q ||
      String(f.nome).toLowerCase().includes(q) ||
      String(f.note || '').toLowerCase().includes(q) ||
      (f.prodotti || []).some(p => String(p).toLowerCase().includes(q))
    );

    const cleanWa = t => {
      const d = String(t || '').replace(/\D/g, '');
      return d.length === 10 && d.startsWith('3') ? '39' + d : d;
    };

    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <h3 style="color:var(--logo-coral);margin:0;">📇 Rubrica Fornitori (${list.length})</h3>
        <div style="display:flex;gap:6px;">
          <button class="btn-note" onclick="v252ScanFornitorePhoto()">📸 Da foto Bolla</button>
          <button class="btn-note" onclick="v252EditFornitore('')">＋ Nuovo</button>
        </div>
      </div>
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:8px;">
        I fornitori e i prodotti vengono estratti in automatico da ogni bolla o fattura caricata.
      </div>
      <div id="v252FornStatus" style="display:none;font-size:.8rem;font-weight:800;color:#065F46;margin-bottom:8px;"></div>
      <input id="v252FornSearch" class="form-control" style="margin-bottom:10px;" placeholder="🔍 Cerca fornitore o ingrediente (es. vongole, vino)..." value="${escH(q)}" oninput="v252FilterForn()">
      <div>
        ${list.map(f => `
          <div class="forn-card">
            <div class="forn-head">
              <div>
                <div class="forn-title">🏢 ${escH(f.nome)}</div>
                <div class="forn-meta">
                  ${f.piva ? 'P.IVA ' + escH(f.piva) + ' · ' : ''}
                  ${f.bolleCount ? `${f.bolleCount} ${f.bolleCount === 1 ? 'bolla' : 'bolle'} · Spesa € ${formatPrice(f.totSpesa)}` : 'Nessuna bolla registrata'}
                  ${f.lastDate ? ' · Ultima: ' + f.lastDate.split('-').reverse().join('/') : ''}
                </div>
                ${f.tel ? `<div class="forn-meta">📞 ${escH(f.tel)}</div>` : ''}
                ${f.email ? `<div class="forn-meta">✉️ ${escH(f.email)}</div>` : ''}
                ${f.addr ? `<div class="forn-meta">📍 ${escH(f.addr)}</div>` : ''}
                ${f.note ? `<div class="forn-meta" style="color:#B45309;">📝 ${escH(f.note)}</div>` : ''}
              </div>
              <button class="btn-note" onclick="v252EditFornitore('${escH(f.id)}')">✏️</button>
            </div>
            ${f.prodotti && f.prodotti.length ? `
              <div class="forn-tags">
                ${f.prodotti.map(p => `<span class="forn-tag">${escH(p)}</span>`).join('')}
              </div>` : ''}
            <div class="forn-actions">
              ${f.tel ? `<a class="btn-note" style="text-decoration:none;background:#DCFCE7;color:#166534;" href="tel:${escH(f.tel)}">📞 Chiama</a>` : ''}
              ${f.tel ? `<a class="btn-note" style="text-decoration:none;background:#25D366;color:#fff;" target="_blank" rel="noopener" href="https://wa.me/${cleanWa(f.tel)}?text=${encodeURIComponent('Ciao ' + f.nome + ', ecco l\'ordine per Alicetta Trattoria:\n- ')}">💬 Ordina WhatsApp</a>` : ''}
              ${f.email ? `<a class="btn-note" style="text-decoration:none;" href="mailto:${escH(f.email)}?subject=${encodeURIComponent('Ordine Alicetta Trattoria')}">✉️ Email</a>` : ''}
              ${!f.tel && !f.email ? `<button class="btn-note" onclick="v252EditFornitore('${escH(f.id)}')">＋ Aggiungi contatti</button>` : ''}
            </div>
          </div>
        `).join('') || '<div style="font-size:.84rem;color:var(--muted);">Nessun fornitore ancora in rubrica. Carica una foto bolla o premi "＋ Nuovo".</div>'}
      </div>
    `;
  }
  window.v252FilterForn = renderRubricaFornitoriUI;

  // Aggancia il rendering quando si apre la tab Fornitori
  const _origSetHubPage = window.setHubPage;
  if (typeof _origSetHubPage === 'function') {
    window.setHubPage = function(key, page, dir) {
      _origSetHubPage.apply(this, arguments);
      if (key === 'sales' && page === 'forn') {
        pullFornitoriFromCloud().then(renderRubricaFornitoriUI);
        renderRubricaFornitoriUI();
      }
    };
  }


  /* =========================================================================
     3. CARICA PRENOTAZIONE DA WHATSAPP E INSERISCI DIRETTAMENTE IN GRIGLIA
     ========================================================================= */
  function injectWhatsAppResButtons() {
    const resForm = $('resForm');
    if (!resForm || $('v252WaResBar')) return;
    const h3 = resForm.querySelector('h3');
    const bar = document.createElement('div');
    bar.id = 'v252WaResBar';
    bar.className = 'wa-res-bar';
    bar.innerHTML = `
      <button type="button" class="btn-wa-res" onclick="v252OpenWaModal()">💬 Carica testo WhatsApp</button>
      <button type="button" class="btn-wa-res alt" onclick="v252ScanWaScreenshot()">📸 Screenshot WhatsApp</button>
    `;
    if (h3 && h3.nextSibling) resForm.insertBefore(bar, h3.nextSibling);
    else resForm.insertBefore(bar, resForm.firstChild);
  }

  // Parser locale intelligente in italiano (funziona anche senza AI / offline)
  function parseWhatsAppTextLocal(txt) {
    const clean = String(txt || '').trim();
    const today = new Date();
    const toISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let date = toISO(today);
    let time = '20:30';
    let covers = 2;
    let phone = '';
    let name = '';
    let note = [];

    // 1. Telefono
    const phMatch = clean.match(/(?:\+?39[\s.-]?)?(3\d{2}[\s.-]?\d{3,4}[\s.-]?\d{3,4}|\b0\d{1,3}[\s.-]?\d{5,8}\b)/);
    if (phMatch) phone = phMatch[0].replace(/[^\d+]/g, '');

    // 2. Data (oggi, domani, dopodomani, giorni settimana o gg/mm)
    const low = clean.toLowerCase();
    if (/\bdopodomani\b/.test(low)) {
      const d = new Date(today); d.setDate(d.getDate() + 2); date = toISO(d);
    } else if (/\bdomani\b/.test(low)) {
      const d = new Date(today); d.setDate(d.getDate() + 1); date = toISO(d);
    } else {
      const dm = low.match(/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-]\s*(\d{2,4}))?\b/);
      if (dm) {
        const dd = parseInt(dm[1], 10), mm = parseInt(dm[2], 10);
        if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) {
          const yy = dm[3] ? (dm[3].length === 2 ? 2000 + parseInt(dm[3], 10) : parseInt(dm[3], 10)) : today.getFullYear();
          date = `${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
        }
      } else {
        const days = ['domenica', 'luned', 'marted', 'mercoled', 'gioved', 'venerd', 'sabat'];
        days.forEach((dw, idx) => {
          if (low.includes(dw)) {
            const d = new Date(today);
            const diff = (idx - d.getDay() + 7) % 7 || 7;
            d.setDate(d.getDate() + diff);
            date = toISO(d);
          }
        });
      }
    }

    // 3. Orario (es. "alle 21", "ore 20:30", "20.15", "pranzo")
    const tmMatch = low.match(/(?:alle|ore|per\s+le|h)\s*(\d{1,2})(?:[:.,](\d{2}))?\b/) || low.match(/\b(1[2345]|19|2[0123])[:.](\d{2})\b/);
    if (tmMatch) {
      const hh = parseInt(tmMatch[1], 10);
      const mm = tmMatch[2] ? tmMatch[2] : '00';
      if (hh >= 11 && hh <= 23) time = String(hh).padStart(2, '0') + ':' + mm;
    } else if (/\bpranzo\b/.test(low)) {
      time = '13:00';
    }

    // 4. Coperti (es. "siamo in 4", "per 6 persone", "4 pax", "tavolo per 3")
    const covMatch = low.match(/(?:siamo\s+in|per|in|tavolo\s+da|tavolo\s+per|x)\s*(\d{1,2})\s*(?:person[ae]|pax|copert[io]|adulti|amici)?\b/) ||
                     low.match(/\b(\d{1,2})\s*(?:person[ae]|pax|copert[io])\b/);
    if (covMatch) {
      const c = parseInt(covMatch[1], 10);
      if (c >= 1 && c <= 60) covers = c;
    }

    // 5. Nome (es. "a nome Marco Rossi", "sono Giulia", "prenotazione Rossi")
    const nmMatch = clean.match(/(?:a\s+nome(?:\s+di)?|sono|mi\s+chiamo|prenotazione|sig\.?|signor(?:a)?)\s+([A-ZÀ-Úa-zà-ú]{2,20}(?:\s+[A-ZÀ-Úa-zà-ú]{2,20})?)/i);
    if (nmMatch) {
      name = nmMatch[1].replace(/\b(per|alle|ore|siamo|in|domani|stasera)\b.*/i, '').trim();
    }
    if (!name) {
      // Cerca nome in formato "[20:15, 22/10/2026] Nome Cognome: messaggio"
      const waHeader = clean.match(/\]\s*([^:]{2,30}):/);
      if (waHeader) name = waHeader[1].trim();
    }

    // 6. Note automatiche (allergie, seggiolone, cane, esterno/interno)
    ['seggiolon', 'passeggin', 'celiac', 'glutine', 'lattosio', 'allerg', 'cane', 'cagnolin', 'estern', 'fuori', 'intern', 'compleann'].forEach(k => {
      if (low.includes(k)) {
        const m = clean.match(new RegExp('[^.,;\\n]*' + k + '[^.,;\\n]*', 'i'));
        if (m) note.push(m[0].trim());
      }
    });

    return {
      name: name || 'Cliente WhatsApp',
      phone,
      date,
      time,
      covers,
      note: [...new Set(note)].join(' · ')
    };
  }

  async function parseWhatsAppSmart(rawText, imageB64) {
    if (getGeminiKey() && navigator.onLine) {
      try {
        const todayISO = buildDateISO();
        const promptParts = [{
          text: `Oggi è ${todayISO} (${new Date().toLocaleDateString('it-IT', { weekday: 'long' })}). Estrai i dati della prenotazione ristorante da questo messaggio WhatsApp. Rispondi SOLO con un oggetto JSON: {"name":"Nome del cliente","phone":"numero telefono se presente o stringa vuota","date":"YYYY-MM-DD","time":"HH:MM (default 20:30 per cena, 13:00 per pranzo)","covers":numero_interi_coperti,"note":"eventuali richieste come seggiolone, allergie, cane, esterno"}.\nTesto: ${rawText || ''}`
        }];
        if (imageB64) promptParts.push({ inline_data: { mime_type: 'image/jpeg', data: imageB64 } });
        const out = await callGemini(promptParts, true);
        const j = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1));
        if (j && (j.name || j.covers)) {
          return {
            name: String(j.name || 'Cliente WhatsApp').trim(),
            phone: String(j.phone || '').trim(),
            date: /^\d{4}-\d{2}-\d{2}$/.test(j.date || '') ? j.date : todayISO,
            time: /^\d{2}:\d{2}$/.test(j.time || '') ? j.time : '20:30',
            covers: Math.max(1, parseInt(j.covers, 10) || 2),
            note: String(j.note || '').trim()
          };
        }
      } catch (e) {}
    }
    return parseWhatsAppTextLocal(rawText);
  }

  window.v252OpenWaModal = async function() {
    let ov = $('v252WaModal');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'v252WaModal';
      ov.className = 'modal-overlay';
      document.body.appendChild(ov);
    }
    ov.innerHTML = `
      <div class="receipt-box">
        <h3 style="color:#16A34A;margin-bottom:6px;">💬 Prenotazione da WhatsApp</h3>
        <div style="font-size:.76rem;color:var(--muted);margin-bottom:8px;">
          Incolla il messaggio WhatsApp del cliente: l'app estrae nome, data, ora, coperti, note e lo inserisce direttamente in griglia col tavolo suggerito.
        </div>
        <textarea id="v252WaInput" class="form-control" rows="4" placeholder="Es: Ciao Christian, siamo in 4 per stasera alle 21:00 a nome Marco Rossi 3331234567, un seggiolone grazie!"></textarea>
        <div id="v252WaSt" style="font-size:.78rem;font-weight:800;color:#166534;margin:6px 0;display:none;"></div>
        <div style="display:grid;gap:6px;margin-top:10px;">
          <button class="btn-main" style="background:#16A34A;color:#fff;" onclick="v252ProcessWa(true)">⚡ Inserisci subito in griglia</button>
          <button class="btn-main btn-print" onclick="v252ProcessWa(false)">📝 Compila modulo per controllare</button>
        </div>
        <div class="modal-actions">
          <button class="btn-modal" style="background:#334155;color:#fff;" onclick="document.getElementById('v252WaModal').classList.remove('active')">Annulla</button>
        </div>
      </div>`;
    ov.classList.add('active');
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const clip = await navigator.clipboard.readText();
        if (clip && clip.trim().length > 4 && $('v252WaInput'))$('v252WaInput').value = clip.trim();
      }
    } catch (e) {}
  };

  window.v252ScanWaScreenshot = function() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (!getGeminiKey()) return alert('Serve la chiave Gemini in ⚙️ Opzioni per leggere gli screenshot.');
      v252OpenWaModal();
      const st = $('v252WaSt');
      if (st) { st.style.display = 'block'; st.textContent = '⏳ Lettura screenshot WhatsApp in corso...'; }
      try {
        const b64 = await shrinkImage(f, 1500);
        const d = await parseWhatsAppSmart('', b64);
        await insertOrFillWaRes(d, true);
      } catch (e) {
        if (st) st.textContent = '❌ Errore: ' + e.message;
      }
    };
    inp.click();
  };

  window.v252ProcessWa = async function(directToGrid) {
    const raw = ($('v252WaInput') &&$('v252WaInput').value || '').trim();
    if (!raw) return alert('Incolla prima il messaggio WhatsApp.');
    const st = $('v252WaSt');
    if (st) { st.style.display = 'block'; st.textContent = '⏳ Analisi messaggio WhatsApp...'; }
    const d = await parseWhatsAppSmart(raw, null);
    await insertOrFillWaRes(d, directToGrid);
  };

  async function insertOrFillWaRes(d, directToGrid) {
    if ($('rName'))$('rName').value = d.name || '';
    if ($('rPhone'))$('rPhone').value = d.phone || '';
    if ($('rDate'))$('rDate').value = d.date || buildDateISO();
    if ($('rTime'))$('rTime').value = d.time || '20:30';
    if ($('rCov'))$('rCov').value = d.covers || 2;
    if ($('rNote'))$('rNote').value = d.note || '';

    const modal = $('v252WaModal');
    if (modal) modal.classList.remove('active');

    if (!directToGrid) return;

    // Inserimento diretto in griglia con assegnazione automatica del tavolo migliore
    const id = 'r' + Date.now();
    const r = {
      id,
      name: d.name || 'Cliente WhatsApp',
      phone: d.phone || '',
      date: d.date || buildDateISO(),
      time: d.time || '20:30',
      covers: parseInt(d.covers, 10) || 2,
      note: d.note ? '[WA] ' + d.note : '[WA]',
      status: 'attesa',
      tables: []
    };
    const sugg = typeof suggestTables === 'function' ? suggestTables(r) : null;
    if (sugg && sugg.ids && sugg.ids.length) {
      r.tables = sugg.ids;
    }
    delete r.id;
    state.res = state.res || {};
    state.res[id] = r;
    await saveState(false, { res: [id] });
    if ($('rView'))$('rView').value = r.date;
    if (typeof renderResList === 'function') renderResList();
    if (typeof renderResBoard === 'function') renderResBoard('resBoardTables');
    const tbTxt = (r.tables || []).map(t => (state.tables[t] && state.tables[t].baseName) || t).join(' + ') || 'Nessun tavolo libero automatico';
    alert(`✅ Prenotazione WhatsApp inserita in griglia!\n\n👤 ${r.name} (${r.covers} cop.)\n📅 ${r.date.split('-').reverse().join('/')} ore ${r.time}\n🪑 Tavolo: ${tbTxt}`);
  }

  // Aggancia il pulsante WhatsApp quando si apre la schermata Prenotazioni
  if (typeof window.renderRes === 'function') {
    const _origRenderRes = window.renderRes;
    window.renderRes = function() {
      _origRenderRes.apply(this, arguments);
      injectWhatsAppResButtons();
    };
  }
  setTimeout(injectWhatsAppResButtons, 600);
})();
</script>
